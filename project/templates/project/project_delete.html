{% extends "base_minimal.html" %}
{% load i18n %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center grow p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 p-6 text-center space-y-5">
        
        <!-- Warning Icon -->
        <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
        </div>

        <!-- Heading & Details -->
        <div class="space-y-1">
            <h2 class="text-xl font-bold text-slate-800">{% trans "Confirm Deletion" %}</h2>
            <p class="text-sm text-slate-500">{% trans "Are you sure you want to delete this item? This action cannot be undone." %}</p>
        </div>

        <!-- Delete Form -->
        <form action="" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <!-- Hidden inputs / form fields -->
            <div class="hidden">
                {{ form }}
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-center gap-3 pt-2">
                <a href="javascript:history.back()" class="w-1/2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-sm transition text-center cursor-pointer">
                    {% trans "Cancel" %}
                </a>
                <button type="submit" class="w-1/2 px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg text-sm shadow transition cursor-pointer">
                    {% trans "Delete" %}
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
