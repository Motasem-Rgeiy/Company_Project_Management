{% load i18n %}

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <h2 class="text-base font-bold text-slate-800 mb-4">{% trans "Create Category" %}</h2>

    <form action="{% url 'blog_category_create' %}" method="POST" class="flex flex-col gap-4">
        {% csrf_token %}

        <div class="flex flex-col gap-3 text-sm text-slate-700">
            {{ form }}
        </div>

        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors w-full sm:w-auto self-end">
            {% trans "Create" %}
        </button>
    </form>
</div>
